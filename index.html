<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRP Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 1);
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Redirection Overlay (Visible only during redirect) -->
    <div id="redirecting" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center hidden">
        <div class="loader mb-4 scale-150"></div>
        <h2 class="text-xl font-medium text-slate-700">Redirecting you...</h2>
        <p class="text-slate-400 text-sm mt-2">zrp.zorpid.com</p>
    </div>

    <!-- Main UI -->
    <div id="main-ui" class="w-full max-w-md">
        <div class="glass p-8 rounded-2xl shadow-xl">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600">ZRP</h1>
                <p class="text-slate-500 mt-2">Shorten your long links instantly</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Destination URL</label>
                    <input type="url" id="longUrl" placeholder="https://example.com/very-long-link" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                </div>

                <button onclick="shortenLink()" id="btnText" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                    <span id="btnLabel">Shorten URL</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </div>

            <div id="resultArea" class="mt-8 hidden animate-in fade-in slide-in-from-bottom-4 duration-500">
                <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-xl relative">
                    <label class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Your Short Link</label>
                    <div class="flex items-center justify-between mt-1">
                        <span id="shortenedLink" class="text-indigo-900 font-mono break-all font-medium"></span>
                        <button onclick="copyLink()" class="ml-2 p-2 hover:bg-indigo-100 rounded-lg transition-colors" title="Copy">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        </button>
                    </div>
                </div>
                <p id="statusMsg" class="text-center text-xs text-slate-400 mt-3"></p>
            </div>
        </div>
        <p class="text-center text-slate-400 text-sm mt-6">All links are stored in Google Sheets</p>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNyoDyQmExUlekpCvgtGRrQq-5qwGNQMa6ernmvDrOz9fYXDdFdW9izIjbQ4DWNa4x/exec"; 
        const BASE_DOMAIN = "https://zrp.zorpid.com/d/"; // Or window.location.origin + '/d/'
        
        async function init() {
            const path = window.location.pathname;
            // Check if we are on a redirect route: /d/code
            if (path.startsWith('/d/')) {
                const code = path.split('/d/')[1];
                if (code) {
                    handleRedirection(code);
                }
            }
        }

        async function handleRedirection(code) {
            const redirectEl = document.getElementById('redirecting');
            const mainUI = document.getElementById('main-ui');
            
            mainUI.classList.add('hidden');
            redirectEl.classList.remove('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'redirect', code: code })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    window.location.href = result.longUrl;
                } else {
                    alert("Short link not found or expired.");
                    window.location.href = '/';
                }
            } catch (err) {
                console.error(err);
                alert("Redirection failed. Please check your connection.");
                window.location.href = '/';
            }
        }

        async function shortenLink() {
            const longUrl = document.getElementById('longUrl').value;
            const btnLabel = document.getElementById('btnLabel');
            const btnLoader = document.getElementById('btnLoader');
            const resultArea = document.getElementById('resultArea');

            if (!longUrl || !longUrl.startsWith('http')) {
                alert("Please enter a valid URL starting with http/https");
                return;
            }

            // UI Loading State
            btnLabel.textContent = "Processing...";
            btnLoader.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'shorten', longUrl: longUrl })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    const shortUrl = BASE_DOMAIN + result.code;
                    document.getElementById('shortenedLink').textContent = shortUrl;
                    document.getElementById('statusMsg').textContent = result.isNew ? "New link created!" : "Link already existed, reusing code.";
                    resultArea.classList.remove('hidden');
                }
            } catch (err) {
                alert("Error connecting to database.");
            } finally {
                btnLabel.textContent = "Shorten URL";
                btnLoader.classList.add('hidden');
            }
        }

        function copyLink() {
            const text = document.getElementById('shortenedLink').textContent;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Copied to clipboard!");
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
