<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorpid URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 1);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-900">

    <div id="app" class="w-full max-w-md">
        <!-- Main UI -->
        <div id="main-ui" class="glass p-8 rounded-2xl shadow-xl space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold tracking-tight text-indigo-600">ZRP.</h1>
                <p class="text-slate-500 mt-2">Simplify your links instantly.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Destination URL</label>
                    <input type="url" id="longUrl" placeholder="https://example.com/very-long-link" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                
                <button onclick="createShortUrl()" id="submitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg shadow-indigo-200">
                    Shorten Link
                </button>
            </div>

            <div id="resultArea" class="hidden animate-in fade-in duration-500">
                <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg">
                    <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">Your Short Link</p>
                    <div class="flex items-center justify-between gap-2">
                        <span id="shortenedUrl" class="text-indigo-700 font-medium break-all"></span>
                        <button onclick="copyToClipboard()" class="text-indigo-600 hover:text-indigo-800 text-sm font-bold">Copy</button>
                    </div>
                </div>
            </div>
            
            <p id="statusMsg" class="text-center text-sm text-slate-500 min-h-[1.25rem]"></p>
        </div>

        <!-- Redirecting UI (Shown when a code is detected) -->
        <div id="redirect-ui" class="hidden glass p-12 rounded-2xl shadow-xl text-center space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <h2 class="text-xl font-semibold">Redirecting...</h2>
            <p class="text-slate-500">Taking you to your destination.</p>
        </div>
    </div>

    <script>
        /** * CONFIGURATION
         * Paste your Google Apps Script Web App URL here 
         */
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQy1bNSSOFQcUmcLjohPNbGoTRP3ivPMFxz_N11Z-7zTN5AOrYBnjYUvXZ1ELqf78P/exec"; 
        const BASE_DOMAIN = "https://zrp.zorpid.com/d/";

        // 1. Check for path code on load
        window.onload = async () => {
            const path = window.location.pathname;
            // Check if path matches /d/CODE
            const match = path.match(/\/d\/([a-zA-Z0-9]{6})/);
            
            if (match && match[1]) {
                handleRedirect(match[1]);
            }
        };

        async function handleRedirect(code) {
            document.getElementById('main-ui').classList.add('hidden');
            document.getElementById('redirect-ui').classList.remove('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?code=${code}`);
                const data = await response.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    document.body.innerHTML = `<div class="text-center p-10">
                        <h1 class="text-2xl font-bold">404</h1>
                        <p>Link not found or expired.</p>
                        <a href="/" class="text-indigo-600 underline">Go Home</a>
                    </div>`;
                }
            } catch (err) {
                console.error(err);
                alert("Redirect failed. Connection error.");
            }
        }

        async function createShortUrl() {
            const longUrl = document.getElementById('longUrl').value;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');

            if (!longUrl || !isValidHttpUrl(longUrl)) {
                status.innerText = "Please enter a valid URL (starting with http/https)";
                return;
            }

            if (!SCRIPT_URL) {
                status.innerText = "Error: SCRIPT_URL is not configured in the code.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Generating...";
            status.innerText = "Communicating with Google Sheets...";

            const shortCode = generateCode(6);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Apps Script requires no-cors for simple POST or handle via options
                    body: JSON.stringify({
                        action: 'create',
                        longUrl: longUrl,
                        shortCode: shortCode
                    })
                });

                // Since no-cors doesn't return the body, we assume success if no catch
                displayResult(shortCode);
                status.innerText = "Success!";
            } catch (err) {
                status.innerText = "Failed to save link.";
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Shorten Link";
            }
        }

        function displayResult(code) {
            const resultArea = document.getElementById('resultArea');
            const linkDisplay = document.getElementById('shortenedUrl');
            const fullUrl = BASE_DOMAIN + code;
            
            linkDisplay.innerText = fullUrl;
            resultArea.classList.remove('hidden');
        }

        function generateCode(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function isValidHttpUrl(string) {
            let url;
            try {
                url = new URL(string);
            } catch (_) {
                return false;  
            }
            return url.protocol === "http:" || url.protocol === "https:";
        }

        function copyToClipboard() {
            const text = document.getElementById('shortenedUrl').innerText;
            const elem = document.createElement('textarea');
            elem.value = text;
            document.body.appendChild(elem);
            elem.select();
            document.execCommand('copy');
            document.body.removeChild(elem);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
